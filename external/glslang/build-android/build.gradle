plugins { id 'com.android.library' }

android {
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

compileSdk = 35
namespace = "com.powervr.glslang"
ndkVersion = "29.0.14206865"
	defaultConfig {
minSdk = 24
targetSdk = 35
versionCode = 1
versionName = "1.0"
		externalNativeBuild {
			cmake {
				cppFlags "-fexceptions"
				arguments "-DANDROID_STL=c++_static", "-DPVR_ENABLE_INSTALL=ON"
				targets "glslang", "SPIRV", "MachineIndependent", "GenericCodeGen", "OSDependent"
			}
		}
		ndk
		{
			abiFilters "$ANDROID_ABI".replace(" ", "").split(",")
		}
	}
	externalNativeBuild {
		cmake {

			path = "../CMakeLists.txt"

			version = "3.22.1+"
		}
	}
}

