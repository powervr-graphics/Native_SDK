apply plugin: 'com.android.library'

android {
	namespace = "com.powervr.PVRSuperResolution"
	ndkVersion = "29.0.14206865"
	defaultConfig {
		minSdkVersion 24
		targetSdkVersion 33
		compileSdkVersion 35
		versionCode 1
		versionName "1.0"
		externalNativeBuild {
			cmake {
				cppFlags "-fexceptions"
				arguments "-DANDROID_STL=c++_static", "-DPVR_PREBUILT_DEPENDENCIES=ON", "-DPVR_ENABLE_INSTALL=ON"
				targets "PVRSuperResolution"
			}
		}
		ndk
		{
			abiFilters "$ANDROID_ABI".replace(" ", "").split(",")
		}
	}
	externalNativeBuild {
		cmake {
			path "../CMakeLists.txt"
			version "3.22.1+"
		}
	}
}

// This block specifies dependencies required to build only the module itself
dependencies {
    // Dependency on local binaries
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Resolve duplicate class issue by forcing a specific kotlin-stdlib version
    // or excluding duplicate modules if possible.
    // However, usually upgrading the kotlin plugin or aligning versions is better.
    // Given the error, it seems `kotlin-stdlib-jdk8` (and 7) are included transitively
    // but are also now part of `kotlin-stdlib` in newer versions (1.8+).
    // Let's try to align them.
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.10"))
}

buildscript {
	repositories {
		if (project.hasProperty('GRADLE_DEPS_PROXY_URL')) {
			maven {
				url "$GRADLE_DEPS_PROXY_URL"
			}
		}
		else {
			google()
			mavenCentral()
		}
	}
	dependencies {
		classpath 'com.android.tools.build:gradle:8.13.0'
	}
}

allprojects {
	repositories {
		if (project.hasProperty('GRADLE_DEPS_PROXY_URL')) {
			maven {
				url "$GRADLE_DEPS_PROXY_URL"
			}
		}
		else {
			google()
			mavenCentral()
		}
	}
}
